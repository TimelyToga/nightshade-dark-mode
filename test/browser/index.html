<!doctype html>
<meta charset="utf-8">
<title>Nightshade regression gallery</title>
<style>
  body { margin: 32px; background: #151922; color: #e4e8f3; font: 16px system-ui; }
  h1 { margin-bottom: 8px; } p { color: #bac4d9; max-width: 900px; line-height: 1.6; }
  #summary { padding: 16px; background: #243047; border-radius: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(400px,1fr)); gap: 20px; }
  article { border: 1px solid #48526a; padding: 16px; border-radius: 12px; }
  iframe { width: 100%; height: 230px; border: 0; background: white; }
  .result { white-space: pre-wrap; font-size: 14px; color: #a3edbb; }
  .fail { color: #ff9c9c; }
</style>
<h1>Nightshade regression gallery</h1>
<p>Synthetic cases using the shipping CSS and scripts. Settings and the 1Password hostname are simulated; no account data or external requests. Assertions run automatically. Reload to rerun.</p>
<p id="summary" role="status">Running…</p>
<main class="grid" id="cases"></main>
<script src="/test/browser/gallery.js"></script>
